<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>成績計算機</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#1b2340;--sub:#6b7391;--line:#d9deec;--key:#f3f5fb;--keyp:#dfe5f6;--acc:#3a4de0;--accink:#fff;--hl:#ffd84d;--hlink:#3b2f00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142a;--card:#1a2040;--ink:#eef1ff;--sub:#9aa3c7;--line:#2c3563;--key:#232b55;--keyp:#2f3a73;--acc:#7b8cff;--accink:#10142a;--hl:#ffd84d;--hlink:#3b2f00;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10142a;--card:#1a2040;--ink:#eef1ff;--sub:#9aa3c7;--line:#2c3563;--key:#232b55;--keyp:#2f3a73;--acc:#7b8cff;--accink:#10142a;--hl:#ffd84d;--hlink:#3b2f00;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.app{max-width:440px;margin:0 auto;padding:16px 16px 24px}
h1{font-size:20px;margin:4px 0 12px;font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:1 0 auto;min-width:48px;border:2px solid var(--line);background:var(--card);color:var(--sub);border-radius:12px;padding:6px 4px;font:inherit;font-size:13px;font-weight:700;text-align:center;cursor:pointer}
.chip b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;min-height:20px}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip.ok b{color:var(--acc)}
.chip:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border-radius:22px;padding:18px;border:1px solid var(--line)}
.sub{display:flex;align-items:center;justify-content:space-between}
.sub h2{margin:0;font-size:34px;font-weight:800;letter-spacing:2px}
.w{background:var(--hl);color:var(--hlink);font-weight:800;border-radius:999px;padding:6px 14px;font-size:15px}
.disp{margin:14px 0 16px;border-bottom:3px solid var(--acc);padding:6px 2px;display:flex;align-items:baseline;justify-content:flex-end;gap:8px;min-height:84px}
.disp span{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.disp span.ph{color:var(--line)}
.disp i{font-style:normal;color:var(--sub);font-size:18px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{height:62px;border:0;border-radius:16px;background:var(--key);color:var(--ink);font:inherit;font-size:28px;font-weight:700;cursor:pointer;transition:transform .08s,background .08s;box-shadow:0 3px 0 var(--line)}
.k:active{transform:translateY(3px);background:var(--keyp);box-shadow:none}
.k.f{font-size:22px;color:var(--sub)}
.go{width:100%;margin-top:12px;height:60px;border:0;border-radius:16px;background:var(--acc);color:var(--accink);font:inherit;font-size:20px;font-weight:800;cursor:pointer;transition:transform .08s,opacity .15s}
.go:active{transform:scale(.98)}
.go:disabled{opacity:.35;cursor:default}
.big{background:var(--acc);color:var(--accink);border-radius:22px;padding:20px 18px}
.big small{font-size:15px;opacity:.85;font-weight:600}
.big div{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.big em{font-style:normal;font-size:18px;opacity:.8;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.st small{color:var(--sub);font-size:14px;font-weight:600}
.st div{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 4px;text-align:right;border-bottom:1px solid var(--line);font-size:15px}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;font-size:13px}
tr.row{cursor:pointer}
tr.row:active{background:var(--key)}
tr:last-child td{border-bottom:0}
.hint{color:var(--sub);font-size:13px;margin:10px 2px 0;text-align:center}
.ghost{width:100%;margin-top:12px;height:52px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
@keyframes slideIn{from{opacity:0;transform:translateX(var(--dx,40px))}to{opacity:1;transform:none}}
.enter{animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{opacity:0;transform:scale(.85)}60%{transform:scale(1.04)}100%{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.up{opacity:0;animation:up .4s ease-out forwards}
@media (prefers-reduced-motion:reduce){.enter,.pop,.up{animation:none;opacity:1}}
@keyframes tIn{from{opacity:0;transform:translateX(calc(var(--dx,40px)*2.5))}}
@keyframes wIn{from{opacity:0;transform:translateY(-36px) rotate(-14deg) scale(.5)}}
@keyframes dIn{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(calc(var(--dx,40px)*-1))}to{clip-path:inset(0 0 0 0)}}
@keyframes kIn{from{opacity:0;transform:translateY(46px) scale(.4) rotate(var(--r,8deg))}}
@keyframes gIn{from{opacity:0;transform:translateY(70px) scaleX(.6)}}
@keyframes out{to{opacity:0;transform:translateX(calc(var(--dx,40px)*-2)) scale(.7)}}
.pt{animation-duration:.45s;animation-fill-mode:backwards;animation-timing-function:cubic-bezier(.2,.9,.3,1.25)}
.pt.t1{animation-name:tIn}
.pt.t2{animation-name:wIn;animation-delay:90ms}
.pt.t3{animation-name:dIn;animation-delay:150ms;animation-timing-function:ease-out}
.pt.k{animation-name:kIn;animation-delay:calc(200ms + var(--w,0)*45ms)}
.pt.go{animation-name:gIn;animation-delay:480ms}
.leave .pt{animation:out .2s ease-in forwards;animation-delay:calc(var(--w,0)*10ms)}
.leave{pointer-events:none}
@media (prefers-reduced-motion:reduce){.pt,.leave .pt{animation:none!important}}
.top{display:flex;align-items:center;justify-content:space-between}
.trophy{border:2px solid var(--line);background:var(--card);border-radius:14px;width:44px;height:44px;font-size:22px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,14,40,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:fade .2s}
.sh{width:100%;max-width:440px;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto;animation:rise .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}}
.sh h3{margin:0 0 6px;font-size:22px}
.mu{color:var(--sub);margin:0 0 12px;font-size:15px}
#nick{width:100%;height:56px;border:2px solid var(--line);border-radius:14px;background:var(--key);color:var(--ink);font:inherit;font-size:20px;font-weight:700;padding:0 14px}
#nick:focus{outline:none;border-color:var(--acc)}
.msg{min-height:22px;margin:8px 2px 0;color:var(--sub);font-size:14px}
.rw{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.rw b{width:32px;height:32px;border-radius:50%;background:var(--key);display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.rw:nth-child(-n+3) b{background:var(--hl);color:var(--hlink)}
.rw span{flex:1;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw em{font-style:normal;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.rw.me{background:var(--key);border-radius:12px}
.sh .go,.sh .ghost{margin-top:12px}
@media (prefers-reduced-motion:reduce){.ov,.sh{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>成績計算機</h1><button class="trophy" onclick="showBoard()" aria-label="排行榜">🏆</button></div>
  <div id="chips" class="chips"></div>
  <div id="main"></div>
  <div id="sheet"></div>
</div>
<script>
var S=[["國文",4],["英文",4],["數學",4],["地理",2],["歷史",2],["地科",2],["化學",2]];
var vals=S.map(function(){return ""});
var cur=0,done=false,editing=false,dir=1,busy=false,last=null,me='';
function $(id){return document.getElementById(id)}
function fmt(x){return String(Number(x.toFixed(2)))}
function firstEmpty(){for(var i=0;i<S.length;i++){if(vals[i]==="")return i}return S.length}
function valid(i){return vals[i]!==""&&vals[i].slice(-1)!=="."}

function press(k){
  if(done)return;
  var v=vals[cur];
  if(k==="b"){v=v.slice(0,-1)}
  else if(k==="."){if(v.indexOf(".")>-1)return;v=v===""?"0.":v+"."}
  else{
    if(v==="0")v="";
    var c=v+k;
    if(Number(c)>100)return;
    if(c.indexOf(".")>-1&&c.split(".")[1].length>2)return;
    v=c;
  }
  vals[cur]=v;
  renderDisp();
}
var FB={apiKey:'AIzaSyD7uyyz5XQvhrqsEi0N7UafoONwV1dL1Vo',projectId:'grade-11219'};
function ready(){return !!(FB.apiKey&&FB.projectId)}
function base(){return 'https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents'}
function nid(n){return encodeURIComponent('n_'+n.replace(/\//g,'／'))}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(v){return Number(v.doubleValue!==undefined?v.doubleValue:v.integerValue)}
function sheet(h){$('sheet').innerHTML='<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sh">'+h+'</div></div>'}
function closeSheet(){$('sheet').innerHTML=''}
function msg(t){var m=$('msg');if(m)m.textContent=t}
function openJoin(){
  var nk='';try{nk=localStorage.getItem('gc_nick')||''}catch(e){}
  sheet('<h3>加入排行榜</h3><p class="mu">加權總分 '+fmt(last.total)+'。輸入暱稱或座號：</p><input id="nick" maxlength="10" value="'+esc(nk)+'" placeholder="例如：小明、12號"><div id="msg" class="msg"></div><button id="sub" class="go" onclick="submit()">送出</button><button class="ghost" onclick="closeSheet()">不用了</button>');
}
async function submit(){
  var n=$('nick').value.trim();
  if(!n){msg('請輸入暱稱或座號');return}
  if(!ready()){msg('排行榜還沒設定好');return}
  try{localStorage.setItem('gc_nick',n)}catch(e){}
  $('sub').disabled=true;msg('送出中…');
  var u=base()+'/scores/'+nid(n)+'?key='+FB.apiKey;
  try{
    var g=await fetch(u);
    if(g.ok){var d=await g.json(),old=num(d.fields.total);
      if(old>=last.total){me=n;msg('「'+n+'」已有 '+fmt(old)+' 分的紀錄，沒有更新');setTimeout(showBoard,1500);return}}
    var b={fields:{nick:{stringValue:n},total:{doubleValue:last.total},avg:{doubleValue:last.avg},wavg:{doubleValue:last.wavg}}};
    var r=await fetch(u,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
    if(!r.ok)throw new Error(r.status);
    me=n;showBoard();
  }catch(e){msg('送出失敗，請稍後再試');var s=$('sub');if(s)s.disabled=false}
}
async function showBoard(){
  sheet('<h3>排行榜</h3><p class="mu">依加權總分排名</p><div id="list"><p class="mu">載入中…</p></div><button class="go" onclick="showBoard()">重新整理</button><button class="ghost" onclick="closeSheet()">關閉</button>');
  var L=$('list');
  if(!ready()){L.innerHTML='<p class="mu">還沒設定雲端資料庫</p>';return}
  try{
    var r=await fetch(base()+':runQuery?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:'scores'}],orderBy:[{field:{fieldPath:'total'},direction:'DESCENDING'}],limit:50}})});
    if(!r.ok)throw new Error(r.status);
    var rows=(await r.json()).filter(function(x){return x.document});
    if(!rows.length){L.innerHTML='<p class="mu">還沒有人上榜，你可以是第一個</p>';return}
    L.innerHTML=rows.map(function(x,i){var f=x.document.fields,n=f.nick.stringValue;return '<div class="rw'+(n===me?' me':'')+'"><b>'+(i+1)+'</b><span>'+esc(n)+'</span><em>'+fmt(num(f.total))+'</em></div>'}).join('');
  }catch(e){L.innerHTML='<p class="mu">讀取失敗，請稍後再試</p>'}
}
function swap(nd,fn){
  if(busy)return;
  var m=$("main"),c=m.querySelector(".card");
  var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(!c||done||rm){fn();return}
  busy=true;
  c.style.setProperty("--dx",(nd*40)+"px");
  m.classList.add("leave");
  setTimeout(function(){busy=false;m.classList.remove("leave");fn()},260);
}
function next(){
  if(!valid(cur))return;
  if(editing){swap(1,function(){editing=false;done=true;render()});return}
  if(cur<S.length-1){swap(1,function(){cur++;dir=1;render()})}
  else{swap(1,function(){done=true;render()})}
}
function jump(i){if(!done&&i===cur)return;var nd=(!done&&i<cur)?-1:1;swap(nd,function(){dir=nd;done=false;editing=false;cur=i;render()})}
function editFromResult(i){done=false;editing=true;cur=i;render()}
function reset(){vals=S.map(function(){return ""});cur=0;done=false;editing=false;render()}

function renderChips(){
  var fe=firstEmpty(),h="";
  for(var i=0;i<S.length;i++){
    var cls="chip"+(i===cur&&!done?" on":"")+(valid(i)?" ok":"");
    var dis=(!done&&i>fe&&!editing)||(done&&false)?" disabled":"";
    h+='<button class="'+cls+'"'+(i>fe&&!done?" disabled":"")+' onclick="jump('+i+')">'+S[i][0]+'<b>'+(vals[i]===""?"":vals[i])+'</b></button>';
  }
  $("chips").innerHTML=h;
}
function renderDisp(){
  var d=$("disp"),g=$("go");
  if(!d)return;
  var v=vals[cur];
  d.innerHTML=v===""?'<span class="ph">0</span><i>分</i>':'<span>'+v+'</span><i>分</i>';
  g.disabled=!valid(cur);
  renderChips();
}
function runCount(){
  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('.cu').forEach(function(el){
    var t=Number(el.dataset.n),t0=null;
    if(rm){el.textContent=fmt(t);return}
    var f=function(ts){
      if(t0===null)t0=ts;
      var p=Math.min((ts-t0)/900,1),e=1-Math.pow(1-p,3);
      el.textContent=p<1?fmt(t*e):fmt(t);
      if(p<1)requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  });
}
function render(){
  renderChips();
  var m=$("main");
  if(done){
    var sum=0,wt=0,wsum=0,wtot=0;
    S.forEach(function(s,i){var n=Number(vals[i]);sum+=n;wt+=s[1];wtot+=n*s[1]});
    var avg=sum/S.length,wavg=wtot/wt;
    last={total:wtot,avg:avg,wavg:wavg};
    var rows=S.map(function(s,i){var n=Number(vals[i]);return '<tr class="row up" style="animation-delay:'+(0.4+i*0.06)+'s" onclick="editFromResult('+i+')"><td>'+s[0]+'</td><td>'+fmt(n)+'</td><td>×'+s[1]+'</td><td>'+fmt(n*s[1])+'</td></tr>'}).join("");
    m.innerHTML='<div class="big pop"><small>加權總分（滿分 '+wt*100+'）</small><div class="cu" data-n="'+wtot+'">0</div></div>'+
      '<div class="two"><div class="st up" style="animation-delay:.2s"><small>平均成績</small><div class="cu" data-n="'+avg+'">0</div></div><div class="st up" style="animation-delay:.3s"><small>加權平均</small><div class="cu" data-n="'+wavg+'">0</div></div></div>'+
      '<div class="card" style="padding:8px 16px"><table><tr><th>科目</th><th>分數</th><th>加權數</th><th>加權分</th></tr>'+rows+'</table></div>'+
      '<button class="go up" style="animation-delay:.85s" onclick="openJoin()">加入排行榜</button><p class="hint up" style="animation-delay:.9s">點科目列可以修改分數</p><button class="ghost up" style="animation-delay:.95s" onclick="reset()">重新輸入</button>';
    runCount();
    return;
  }
  var keys=["1","2","3","4","5","6","7","8","9",".","0","b"];
  var pad=keys.map(function(k,ix){return '<button style="--w:'+(Math.floor(ix/3)+ix%3)+';--r:'+(ix%2?8:-8)+'deg" class="pt k'+(k==="."||k==="b"?" f":"")+'" onclick="press(\''+k+'\')" aria-label="'+(k==="b"?"刪除":k)+'">'+(k==="b"?"⌫":k)+'</button>'}).join("");
  var last=cur===S.length-1||editing;
  m.innerHTML='<div class="card" style="--dx:'+(dir*40)+'px"><div class="sub"><h2 class="pt t1">'+S[cur][0]+'</h2><span class="w pt t2">加權數 '+S[cur][1]+'</span></div>'+
    '<div id="disp" class="disp pt t3"></div><div class="pad">'+pad+'</div>'+
    '<button id="go" class="go pt" onclick="next()">'+(last?"算結果":"下一科")+'</button></div>';
  renderDisp();
}
document.addEventListener("keydown",function(e){
  if(done||$("sheet").firstChild||e.target.tagName==="INPUT")return;
  if(/^[0-9.]$/.test(e.key))press(e.key);
  else if(e.key==="Backspace")press("b");
  else if(e.key==="Enter")next();
});
render();
</script>
</body>
</html>
